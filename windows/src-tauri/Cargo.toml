[package]
name = "choibuddy"
version = "0.9.4"
description = "Claude Code 작업을 실시간으로 보여 주고 원격 승인을 받는 위젯"
authors = ["choidevhi"]
edition = "2024"
license = "MIT"

[lib]
name = "choibuddy_lib"
crate-type = ["rlib"]

[[bin]]
name = "choibuddy"
path = "src/main.rs"
test = false

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# `unstable` turns on multi-webview (`Window::add_child`) for the in-app browser.
# `macos-private-api` lets the floating buddy's window be transparent on macOS.
tauri = { version = "2", features = ["tray-icon", "image-png", "unstable", "macos-private-api"] }
tauri-plugin-autostart = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-window-state = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"

# The in-app browser drives WebView2 directly, so it is Windows only.
[target.'cfg(windows)'.dependencies]
# Same image crate Tauri already builds for `image-png`; crops browser captures.
image = { version = "0.25", default-features = false, features = ["png"] }
# Pinned to the versions wry uses, so `with_webview` hands us the same COM types.
webview2-com = "0.39"
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_System_Com",
    "Win32_System_Com_StructuredStorage",
    "Win32_UI_WindowsAndMessaging",
] }

[dev-dependencies]
tempfile = "3"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
